<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Оживи 3D-мир</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      text-align: center;
      color: #172554;
    }

    h1 { margin: 22px 10px 8px; }

    p { padding: 0 16px; }

    model-viewer {
      width: 100%;
      height: 420px;
      background: #dbeafe;
    }

    .controls {
      padding: 20px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    input { width: 80%; }
  </style>
</head>

<body>

  <h1>🚀 Оживи 3D-мир!</h1>
  <p>Изучи объект, измени размер
     и перенеси его в реальность.</p>

  <model-viewer
    id="viewer"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="Трёхмерная модель космонавта"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor">

    <button slot="ar-button">
      📱 Посмотреть в AR
    </button>

  </model-viewer>

  <div class="controls">
    <h3>Измени размер модели</h3>

    <input
      type="range"
      min="0.2"
      max="2"
      step="0.1"
      value="1"
      id="scale"
    >

    <p id="sizeText">Масштаб: 100%</p>
  </div>

  <script>
    const viewer = document.getElementById("viewer");
    const slider = document.getElementById("scale");
    const label = document.getElementById("sizeText");

    slider.addEventListener("input", () => {
      const value = Number(slider.value);
      viewer.scale = `${value} ${value} ${value}`;
      label.textContent =
        `Масштаб: ${Math.round(value * 100)}%`;
    });
  </script>

</body>
</html>
